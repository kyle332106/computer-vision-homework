data_root: D:/Новая папка/alpr_data
raw_detection_zip: D:/Новая папка/alpr_data/autoria_detection.zip
raw_detection_dir: D:/Новая папка/alpr_data/autoriaNumberplateDataset-2026-01-13
yolo_dataset_dir: D:/Новая папка/alpr_data/yolo_plates
synthetic_zip: D:/Новая папка/alpr_data/zenodo_synthetic_ua.zip
synthetic_dir: D:/Новая папка/alpr_data/synthetic_ua

subset_size: 4000
train_split: 0.8
class_name: license_plate

detector:
  model: yolo26n.pt
  epochs: 30
  imgsz: 640
  batch: 16
  device: 0

ocr:
  # backend: "crnn" (собственная CRNN+CTC) или "easyocr"
  backend: crnn
  crnn_weights: models/crnn_ocr.pt
  # языки для EasyOCR-fallback
  languages: [uk, en]
  # strict_format=true — стрипать всё кроме [A-Z0-9] (для строгого UA)
  # strict_format=false — читать произвольный текст (именные, иностранные)
  strict_format: false

crnn:
  rnn_hidden: 256
  epochs: 20
  batch_size: 64
  lr: 3.0e-4
  input_h: 32

synthetic_ocr:
  n_samples: 20000
  train_frac: 0.9
  out_dir: data/synthetic_ocr
